<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="orbGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <!-- Dynamic Pulse Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(1.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.12); }
      }
      @keyframes scanline {
        0% { transform: translateY(-100px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateY(420px); opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -40; }
      }
      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 8s ease-in-out infinite;
      }
      .orb-pulse {
        animation: pulseGlow 6s ease-in-out infinite alternate;
        transform-origin: center;
      }
      .scan-beam {
        animation: scanline 5s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .grid-flow {
        stroke-dasharray: 6 6;
        animation: dashFlow 3s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind content) -->
  <circle class="orb-pulse" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.25" filter="url(#orbGlow)" />
  <circle class="orb-pulse" cx="1020" cy="320" r="160" fill="#818cf8" opacity="0.22" filter="url(#orbGlow)" style="animation-delay: -3s;" />
  <circle class="orb-pulse" cx="600" cy="210" r="180" fill="#c084fc" opacity="0.12" filter="url(#orbGlow)" style="animation-delay: -1.5s;" />

  <!-- Subtle Blueprint Tech Grid -->
  <g opacity="0.15">
    <path d="M 0 70 L 1200 70 M 0 140 L 1200 140 M 0 210 L 1200 210 M 0 280 L 1200 280 M 0 350 L 1200 350" stroke="#38bdf8" stroke-width="1" />
    <path d="M 150 0 L 150 420 M 300 0 L 300 420 M 450 0 L 450 420 M 600 0 L 600 420 M 750 0 L 750 420 M 900 0 L 900 420 M 1050 0 L 1050 420" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- Animated Scanner Laser (Dynamic background accent) -->
  <line class="scan-beam" x1="0" y1="0" x2="1200" y2="0" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.4" filter="url(#glow)" />

  <!-- Dynamic Flow Connector Lines -->
  <path class="grid-flow" d="M 120 320 C 300 380, 450 340, 600 360 C 750 380, 900 320, 1080 340" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.3" />

  <!-- Background Animated Pill Badges (Decorations on Sides) -->
  <g class="floating-card-1" opacity="0.75">
    <!-- Left Decorative Card -->
    <rect x="50" y="80" width="180" height="54" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="75" cy="107" r="6" fill="#38bdf8" />
    <text x="92" y="103" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">CLAUSE RISK</text>
    <text x="92" y="122" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">AI Scoring: 9.4/10</text>
  </g>

  <g class="floating-card-2" opacity="0.75">
    <!-- Right Decorative Card -->
    <rect x="970" y="270" width="180" height="54" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="995" cy="297" r="6" fill="#c084fc" />
    <text x="1012" y="293" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">PLAYBOOK AUDIT</text>
    <text x="1012" y="312" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Auto Redline Ready</text>
  </g>

  <!-- Central Foreground Shield & Icon -->
  <g transform="translate(600, 105)">
    <!-- Outer Shield Halo -->
    <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="2" filter="url(#glow)" />
    <!-- Shield Graphic -->
    <path d="M 0 -22 L 20 -12 C 20 8, 11 22, 0 28 C -11 22, -20 8, -20 -12 Z" fill="url(#shieldGrad)" />
    <!-- Checkmark inside Shield -->
    <path d="M -7 -1 L -2 4 L 8 -6" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- FOREGROUND TEXT (Prominent, High Contrast, Perfectly Centered) -->
  <g text-anchor="middle">
    <!-- Category Tag Badge -->
    <rect x="475" y="172" width="250" height="26" rx="13" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="600" y="189" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.5">⚖️ LEGAL TECH CURATED INDEX</text>

    <!-- Main Title -->
    <text x="600" y="250" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
      Awesome Contract Risk Assessment &amp; Mitigation
    </text>

    <!-- Subtitle -->
    <text x="600" y="292" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" letter-spacing="0.2">
      Clause-Level Risk Scoring • Playbook Enforcement • Automated AI Redlining
    </text>

    <!-- Sub-tagline / Feature Pills Foreground -->
    <g transform="translate(600, 345)">
      <!-- Pill 1 -->
      <g transform="translate(-240, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Pre-Signature Defense</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(0, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📑 Word Track Changes</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(240, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#1e293b" stroke="#c084fc" stroke-width="1.2" />
        <text x="0" y="5" fill="#f5d0fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Open Source &amp; SaaS</text>
      </g>
    </g>
  </g>
</svg>
